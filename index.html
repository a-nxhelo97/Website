<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Page</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: system-ui, sans-serif;
  }
  #openBtn {
    padding: 16px 36px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
  }
  #openBtn:hover { background: #1d4ed8; }
</style>
</head>
<body>

  <button id="openBtn">Click Me</button>

<script>
  // ▼▼▼▼▼▼▼▼▼▼▼▼ PUT YOUR URL HERE (between the quotes) ▼▼▼▼▼▼▼▼▼▼▼▼
  const URL_TO_OPEN = "https://your-deployment-url.com/ece4a80";
  // ▲▲▲▲▲▲▲▲▲▲▲▲ END OF URL AREA ▲▲▲▲▲▲▲▲▲▲▲▲

  document.getElementById('openBtn').onclick = () => {
    window.open(URL_TO_OPEN, '_blank');   // opens in a new tab
    // To open in the same tab instead, use: window.location.href = URL_TO_OPEN;
  };
</script>
</body>
</html>
